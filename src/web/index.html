<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Fireteam · Field terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@87.5..112.5,100..800&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
/* The same tokens as the app: a near-black ground and pale ink in a few
   lightness steps, tinted toward the accent's hue, and the accent as the one
   signal colour. The hex values are the fallback for the default yellow. */
:root{
  --accent:#ffd60a;
  --bg:#121110;--panel:#1a1917;--raised:#252321;--line:#2c2a27;--line-strong:#43403b;
  --text:#ecebe7;--text2:#c4c1bb;--dim:#8f8c86;--faint:#625f5a;--wash:#2a2412;--ink:#121110;
  --danger:#f0605a;--good:#7ccf8a;--amber:#e6b85c;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@supports (color: oklch(from red l c h)){
  :root{
    --bg:oklch(from var(--accent) .125 min(c, .012) h);
    --panel:oklch(from var(--accent) .16 min(c, .015) h);
    --raised:oklch(from var(--accent) .205 min(c, .018) h);
    --line:oklch(from var(--accent) .26 min(c, .018) h);
    --line-strong:oklch(from var(--accent) .36 min(c, .024) h);
    --text:oklch(from var(--accent) .94 min(c, .012) h);
    --text2:oklch(from var(--accent) .82 min(c, .016) h);
    --dim:oklch(from var(--accent) .64 min(c, .02) h);
    --faint:oklch(from var(--accent) .46 min(c, .02) h);
    --wash:oklch(from var(--accent) .22 min(calc(c * .3), .06) h);
    /* Dark ink on a light accent, pale ink on a dark one. */
    --ink:oklch(from var(--accent) clamp(.125, calc((.62 - l) * 1000), .97) min(c, .012) h);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text2);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
button{cursor:pointer}

/* Header: the wordmark as the app prints it, the link's state at the end. */
header{display:flex;align-items:flex-start;gap:12px;padding:4px 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
header .bar{width:6px;height:6px;background:var(--accent);margin-top:11px;flex:none}
h1{margin:0;font:500 24px/1.15 var(--mono);font-stretch:112.5%;letter-spacing:-.5px;color:var(--text)}
.tag{font:400 13px/1.4 var(--body);color:var(--dim)}
.link{margin-left:auto;text-align:right;font:400 11px/1.4 var(--mono);font-stretch:87.5%;padding-top:7px;white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;background:var(--faint);margin-right:7px;vertical-align:1px}
.dot.on{background:var(--good)}

/* An operation on the board: a raised row, its state as a square. */
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:inherit;padding:12px 14px 13px;margin:0 0 8px;font:inherit;border-radius:0;position:relative}
.card:active{background:var(--raised)}
@media (hover:hover){.card:hover{background:var(--raised)}}
.card.waiting{border-color:var(--danger)}
.card.waiting::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--danger)}
.card .name{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 17px/1.3 var(--mono);font-stretch:112.5%;letter-spacing:-.3px;color:var(--text)}
.card .name::before{content:"";width:7px;height:7px;flex:none;background:var(--faint)}
.card.deployed .name::before{background:var(--accent)}
.card.complete .name::before{background:var(--good)}
.card.failed .name::before,.card.aborted .name::before{background:var(--danger)}
.card.held .name::before,.card.interrupted .name::before,.card.pinned .name::before{background:var(--amber)}
.card .meta{font:400 12px/1.45 var(--mono);font-stretch:87.5%;color:var(--dim);margin-top:4px;padding-left:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .progress{margin-left:17px}
.badge{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--body);letter-spacing:0;color:var(--text2);background:var(--bg);border:1px solid var(--line);padding:5px 8px}
.badge::before{content:"";width:6px;height:6px}
.badge.red{border-color:var(--danger);color:var(--text)}
.badge.red::before{background:var(--danger)}
.badge.amber::before{background:var(--amber)}
.progress{height:3px;background:var(--line);margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent)}

/* Section heads: a small accent square, the name, a hairline to the end. */
h2{display:flex;align-items:center;gap:10px;font:500 13px/1.3 var(--body);color:var(--text2);margin:24px 0 10px}
h2::before{content:"";width:5px;height:5px;background:var(--accent);flex:none}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

.back{background:none;border:0;color:var(--dim);font:500 14px var(--body);padding:8px 0;margin:0 0 6px}
.back:active{color:var(--text)}
@media (hover:hover){.back:hover{color:var(--text)}}
#main > .tag{font:400 12px/1.5 var(--mono);font-stretch:87.5%}
.big{font:500 28px/1.15 var(--mono);font-stretch:112.5%;letter-spacing:-.8px;color:var(--text);margin:6px 0 10px;overflow-wrap:anywhere}
.box{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;color:var(--text2);position:relative;overflow-wrap:anywhere}
.box.red,.box.amber{color:var(--text)}
.box.red::before,.box.amber::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--danger)}
.box.amber::before{background:var(--amber)}
.box.red{border-color:var(--danger)}
.comms{background:var(--bg);font:400 12px/1.55 var(--mono);font-stretch:87.5%;max-height:340px;overflow:auto;color:var(--text2)}
.comms div{margin-bottom:3px;word-break:break-word}
.comms b{display:inline-block;width:64px;color:var(--dim);font-weight:560}
.k-say{color:var(--text)}.k-sys{color:var(--dim)}
.k-tool b,.k-report b{color:var(--accent)}.k-error b,.k-ask b{color:var(--danger)}.k-cmd b,.k-denied b{color:var(--amber)}.k-result b,.k-review b{color:var(--good)}
.k-error,.k-ask{color:var(--danger)}

/* Keys as the app draws them: square, a firm border, the primary in the accent. */
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row > input{flex:1 1 180px;width:auto}
button.act{flex:1 1 auto;min-height:44px;background:var(--panel);color:var(--text);border:1px solid var(--line-strong);border-radius:0;font:600 14px/1.2 var(--body);letter-spacing:0;padding:10px 16px}
button.act:active{background:var(--raised)}
@media (hover:hover){button.act:hover{background:var(--raised);border-color:var(--text2)}}
button.act.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
button.act.danger{color:var(--danger)}
@media (hover:hover){button.act.danger:hover{border-color:var(--danger)}}
button.act:disabled{opacity:.4}
textarea,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line-strong);border-radius:0;padding:11px 12px;font:400 16px/1.4 var(--body);outline:none}
textarea:focus,input:focus{border-color:var(--accent)}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea{min-height:84px;resize:vertical;display:block}
.mono{font-family:var(--mono);font-stretch:87.5%;font-size:12px;line-height:1.55}
.box.mono{color:var(--text2)}
.empty{color:var(--dim);text-align:center;padding:56px 12px;font:400 14px/1.5 var(--body)}
.criteria div{margin:4px 0}
.met{color:var(--good)}.unmet{color:var(--danger)}.claimed{color:var(--amber)}
.toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));background:var(--panel);color:var(--text);border:1px solid var(--line-strong);border-left:2px solid var(--accent);padding:12px 14px;font:500 14px var(--body);display:none;max-width:688px;margin:0 auto}
.map{background:var(--bg);padding:0;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .note{padding:8px 12px;border-top:1px solid var(--line);font:11px var(--mono);font-stretch:87.5%;color:var(--dim)}
@keyframes pulse{from{r:6;opacity:1}to{r:22;opacity:0}}
.map .ring{fill:none;stroke:var(--accent);stroke-width:1.5;animation:pulse 1.3s ease-out infinite}
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <div><h1>FIRETEAM</h1><div class="tag">Field terminal</div></div>
  <div class="link tag"><span class="dot" id="live"></span><span id="squad"></span></div>
</header>
<main id="main"><div class="empty">Connecting…</div></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
// The token arrives in the address's fragment when pairing, which browsers
// never send to the server; it's kept for next time.
const fromHash = location.hash.slice(1);
if (fromHash) { try { localStorage.setItem("fireteam-token", fromHash) } catch (e) {} history.replaceState(null, "", location.pathname + location.search) }
let token = fromHash; try { token = token || localStorage.getItem("fireteam-token") || "" } catch (e) {}
// ?op=<id> opens straight onto an operation.
let current = new URLSearchParams(location.search).get("op");
const main = document.getElementById("main");

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "disabled") node.disabled = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false)
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}
async function api(path, body) {
  const response = await fetch(path, { method: body ? "POST" : "GET", headers: { "Authorization": "Bearer " + token,
    "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await response.json().catch(() => ({}));
  if (response.status === 401) throw new Error("unpaired");
  if (!response.ok) toast(data.error || "That didn't work.");
  return data;
}
function toast(text) {
  const t = document.getElementById("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 3000);
}
const label = s => ({ deployed: "Deployed", complete: "Complete", failed: "Failed", aborted: "Aborted", held: "Holding",
  staged: "Staged", pinned: "Pinned down", interrupted: "Interrupted" })[s] || "Standby";

function setAccent(accent) {
  if (/^#[0-9a-f]{6}$/i.test(accent || "")) document.documentElement.style.setProperty("--accent", accent);
}
// An operation opened straight from a link still takes the accent.
api("/api/state").then(state => setAccent(state.accent)).catch(() => {});
async function render() {
  if (!token) { main.replaceChildren(el("div", { class: "empty" }, "Scan the pairing code in Fireteam (P) to connect.")); return }
  try { current ? await renderOp(current) : await renderList() }
  catch (e) { main.replaceChildren(el("div", { class: "empty" }, e.message === "unpaired" ? "Not paired, or the code changed. Scan it again in Fireteam." : "Can't reach Fireteam.")) }
}
async function renderList() {
  const state = await api("/api/state");
  setAccent(state.accent);
  document.getElementById("squad").textContent = state.deployed + " / " + (state.maxDeployed || "∞") + " deployed";
  if (!state.operations.length) { main.replaceChildren(el("div", { class: "empty" }, "No operations on the board")); return }
  main.replaceChildren(...state.operations.map(op => {
    const waiting = op.waiting > 0;
    return el("button", { class: "card " + op.status + (waiting ? " waiting" : ""), onclick: () => { current = op.id; render() } },
      el("div", { class: "name" }, op.codename,
        waiting ? el("span", { class: "badge red" }, "Waiting on you") : null,
        op.requests ? el("span", { class: "badge amber" }, op.requests + " to approve") : null),
      el("div", { class: "meta" }, op.status === "deployed" && op.activity ? "▸ " + op.activity
        : label(op.status) + " · cycle " + op.cyclesDone + "/" + op.cycles + " · ≈$" + op.cost.toFixed(2)),
      op.status === "deployed" && op.progress >= 0 ? el("div", { class: "progress" }, el("i", { style: "width:" + op.progress + "%" })) : null);
  }));
}
// The project's knowledge graph: this operation's files in the accent, others'
// work dimmer, and what's being edited now pulsing.
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  node.append(...children.filter(Boolean));
  return node;
}
async function drawMap(box, id) {
  const g = await api("/api/op/" + id + "/graph").catch(() => ({}));
  if (!g.files || !g.files.length) {
    box.replaceChildren(el("div", { class: "note" }, g.state === "building" ? "Mapping the project…" : "No map of this project yet. Map it from the board (G)."));
    return;
  }
  const W = 1000, H = 640, X = x => 30 + x * (W - 60), Y = y => 20 + y * (H - 40);
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--text2").trim() || "#c9c8c1";
  const lines = g.links.map(([a, b]) => svg("line", { x1: X(g.files[a][1]), y1: Y(g.files[a][2]), x2: X(g.files[b][1]), y2: Y(g.files[b][2]),
    stroke: ink, "stroke-opacity": g.mine[g.files[a][0]] && g.mine[g.files[b][0]] ? 0.35 : 0.12, "stroke-width": 1.2 }));
  const most = Math.max(1, ...Object.values(g.mine));
  const nodes = g.files.map(([path, x, y, symbols]) => {
    const size = 7 + Math.sqrt(symbols) * 2.2, mine = g.mine[path], other = g.others[path], live = g.live[path];
    const name = path.slice(path.lastIndexOf("/") + 1);
    return svg("g", {},
      live ? svg("circle", { class: "ring", cx: X(x), cy: Y(y), r: 6 }) : null,
      svg("rect", { x: X(x) - size / 2, y: Y(y) - size / 2, width: size, height: size,
        fill: mine || live ? "var(--accent)" : ink, "fill-opacity": mine ? 0.45 + 0.55 * mine / most : other ? 0.5 : 0.28 },
        svg("title", {}, path + (mine ? " · " + mine + " cycle(s) by this operation" : "") + (live ? " · being edited by " + live : ""))),
      mine || live ? svg("text", { x: X(x) + size / 2 + 6, y: Y(y) + 7, fill: "var(--text)", "font-size": 22, "font-family": "Martian Mono, monospace" }, name) : null);
  });
  // Counted on the map only: graphify doesn't map every kind of file.
  const touched = g.files.filter(f => g.mine[f[0]]).length, editing = Object.keys(g.live).length;
  box.replaceChildren(svg("svg", { viewBox: "0 0 " + W + " " + H }, ...lines, ...nodes),
    el("div", { class: "note" }, "# " + g.files.length + " files · " + touched + " changed by this operation" + (editing ? " · " + editing + " being edited now" : "")));
}

async function renderOp(id) {
  const op = await api("/api/op/" + id);
  if (!op.id) { current = null; return renderList() }
  const act = async (action, body) => { await api("/api/op/" + id + "/" + action, body || {}); render() };
  const parts = [
    el("button", { class: "back", onclick: () => { current = null; render() } }, "‹ Board"),
    el("div", { class: "tag" }, label(op.status) + " · cycle " + op.cyclesDone + "/" + op.cycles + " · " + (op.model || "default model") + " · ROE " + op.roe),
    el("p", { class: "big" }, op.codename),
  ];
  if (op.status === "deployed") parts.push(el("div", { class: "mono", style: "color:var(--accent)" }, "▸ " + (op.activity || "Awaiting contact…")),
    op.progress >= 0 ? el("div", { class: "progress" }, el("i", { style: "width:" + op.progress + "%" })) : null);
  for (const q of op.questions) {
    const answer = el("input", { placeholder: "Or answer in your own words" });
    parts.push(el("h2", {}, "Question"), el("div", { class: "box red" }, q.question,
      el("div", { class: "row" }, ...(q.options || []).map((o, i) => el("button", { class: "act" + (i === 0 ? " primary" : ""), onclick: () => act("answer", { id: q.id, text: o }) }, o))),
      el("div", { class: "row" }, answer, el("button", { class: "act", onclick: () => answer.value.trim() && act("answer", { id: q.id, text: answer.value }) }, "Send"))));
  }
  for (const p of op.prompts) parts.push(el("h2", {}, "Permission"), el("div", { class: "box red" }, el("div", { class: "mono" }, p.summary),
    el("div", { class: "row" }, el("button", { class: "act danger", onclick: () => act("decide", { id: p.id, decision: "deny" }) }, "Deny"),
      el("button", { class: "act", onclick: () => act("decide", { id: p.id, decision: "always" }) }, "Always"),
      el("button", { class: "act primary", onclick: () => act("decide", { id: p.id, decision: "once" }) }, "Approve once"))));
  op.requests.forEach((r, i) => parts.push(el("h2", {}, "Refused, to approve"), el("div", { class: "box amber" }, el("div", { class: "mono" }, r.summary),
    el("div", { class: "row" }, el("button", { class: "act danger", onclick: () => act("deny", { request: i }) }, "Deny"),
      el("button", { class: "act primary", onclick: () => act("approve", { request: i, rule: 0 }) }, "Approve " + (r.choices[0] || []).join(" + "))))));
  parts.push(el("h2", {}, "Objective"), el("div", { class: "box" }, op.objective));
  const map = el("div", { class: "box map" });
  parts.push(el("h2", {}, "Map"), map);
  drawMap(map, id);
  if (op.criteria.length) parts.push(el("h2", {}, "Criteria"), el("div", { class: "box criteria" }, ...op.criteria.map(c =>
    el("div", { class: c.state }, (c.state === "met" ? "● " : c.state === "unmet" ? "✕ " : c.state === "claimed" ? "◐ " : "○ ") + c.text))));
  if (op.gates) parts.push(el("h2", {}, "Gates"), el("div", { class: "box mono" }, ...op.gates.map(g => el("div", { class: g.passed ? "met" : "unmet" }, (g.passed ? "✓ " : "✕ ") + g.name + "  " + g.command))));
  if (op.sitrep) parts.push(el("h2", {}, "Sitrep"), el("div", { class: "box" }, op.sitrep));
  if (op.review) parts.push(el("h2", {}, "Overwatch"), el("div", { class: "box" }, String(op.review.grade).replace(/^./, ch => ch.toUpperCase()).replace("-", " ") + " · " + op.review.summary));
  const order = el("textarea", { placeholder: "Orders for the next cycle" });
  parts.push(el("h2", {}, "Orders"), order, el("div", { class: "row" },
    el("button", { class: "act primary", onclick: async () => { if (order.value.trim()) { await act("order", { text: order.value }); toast("Orders queued.") } } }, "Send orders"),
    op.status === "deployed" ? el("button", { class: "act", onclick: () => act("hold") }, op.hold ? "Lift hold" : "Hold") : null,
    op.status === "held" ? el("button", { class: "act primary", onclick: () => act("resume") }, "Resume") : null,
    ["deployed", "staged", "pinned"].includes(op.status) ? el("button", { class: "act danger", onclick: () => confirm("Abort " + op.codename + "?") && act("abort") }, "Abort") : null));
  parts.push(el("h2", {}, "Comms"), el("div", { class: "box comms" }, ...op.comms.map(c => el("div", { class: "k-" + c.kind }, el("b", {}, c.kind), c.text))));
  main.replaceChildren(...parts);
  const comms = main.querySelector(".comms"); if (comms) comms.scrollTop = comms.scrollHeight;
}

// Live: re-fetch whenever Fireteam says something changed, unless typing.
function listen() {
  if (!token) return;
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  const live = document.getElementById("live");
  events.onopen = () => live.classList.add("on");
  events.onerror = () => live.classList.remove("on");
  events.addEventListener("update", () => {
    const active = document.activeElement;
    if (!active || !["INPUT", "TEXTAREA"].includes(active.tagName) || !active.value) render();
  });
}
render(); listen();
</script>
</body>
</html>
